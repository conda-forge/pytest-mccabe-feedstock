{% set name = "pytest-mccabe" %}
{% set version = "0.1" %}

package:
  name: '{{ name|lower }}'
  version: '{{ version }}'

source:
  fn: '{{ name }}-{{ version }}.tar.gz'
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  'sha256': 'f68af99861c06a27d45ee7682071a201fe0a7785f2ec0a96080022db5ca62012'

build:
  noarch: python
  number: 2
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - pytest-cache
    - pytest >=2.3.dev14
    - mccabe
  run:
    - python >={{ python_min }}
    - setuptools
    - pytest-cache
    - pytest >=2.3.dev14
    - mccabe

test:
  requires:
    - python {{ python_min }}
  commands:
    - py.test --mccabe -h

about:
  home: https://github.com/The-Compiler/pytest-mccabe
  license: MIT
  license_family: MIT
  summary: pytest plugin to run the mccabe code complexity checker.
  description: "py.test plugin for checking cyclomatic complexity of python source with 'mccabe'."

extra:
  recipe-maintainers:
    # GitHub IDs for maintainers of the recipe.
    # Always check with the people listed below if they are OK becoming maintainers of the recipe. (There will be spam!)
    - visze
